<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Echoes of the Abyss</title>
<style>
:root{--bg:#0b0710;--stone:#1c1620;--stone2:#241b2c;--blue:#3ee6ff;--purple:#b94dff;--text:#e8dfff;--red:#ff4d6d;--gold:#e8c468;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;min-height:100%;background-image:url('fondo.png'),repeating-linear-gradient(90deg,rgba(0,0,0,.4) 0 34px,rgba(0,0,0,0) 34px 150px),radial-gradient(ellipse at top,#2c2033,#0b0710 70%);
background-size:cover,auto,cover;background-position:center,top left,center;background-repeat:no-repeat,repeat,no-repeat;background-attachment:fixed,scroll,scroll;
color:var(--text);
font-family:Georgia,'Times New Roman',serif;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;}
h1{margin:4px 0;font-size:1.5em;letter-spacing:2px;text-shadow:0 0 12px var(--purple);text-align:center;}
.hud{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:.9em;background:var(--stone);
padding:8px 16px;border-radius:8px;border:1px solid #3a2e44;}
.hud b{color:var(--gold);}
.hpwrap{width:100%;max-width:300px;background:var(--stone);border:1px solid #3a2e44;border-radius:8px;padding:6px 12px;font-size:.85em;}
#board{position:relative;display:grid;grid-template-columns:repeat(5,56px);grid-template-rows:repeat(5,56px);gap:4px;
background:#000;padding:8px;border-radius:10px;border:3px double var(--gold);box-shadow:0 0 30px #000 inset,0 0 20px #000;}
.cell{position:relative;background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.15) 0 2px,transparent 2px 8px),linear-gradient(160deg,var(--stone2),var(--stone));
border:1px solid #362a40;border-radius:4px;display:flex;align-items:center;justify-content:center;}
.cell.movable{cursor:pointer;box-shadow:0 0 8px #4caf5088 inset;}
.cell.movable:hover{box-shadow:0 0 12px #4caf50;}
.tok{position:relative;z-index:2;width:82%;height:82%;border-radius:6px;overflow:hidden;}
.tok img{width:100%;height:100%;object-fit:contain;}
.p-tok{box-shadow:0 0 14px 4px var(--blue);border:2px solid var(--blue);}
.e-tok{box-shadow:0 0 14px 4px var(--purple);border:2px solid var(--purple);}
.hazard{position:absolute;inset:2px;border-radius:4px;display:flex;align-items:center;justify-content:center;}
.hazard img{width:70%;height:70%;object-fit:contain;}
.hazard-roca{background:linear-gradient(160deg,#5a5560,#2b2730);box-shadow:0 0 8px #000 inset;}
.hazard-lava{background:radial-gradient(circle,#ff6a3d,#7a1a00);box-shadow:0 0 14px 4px #ff4d0088;}
.bar{width:100%;height:12px;background:#1a1220;border-radius:6px;overflow:hidden;border:1px solid #3a2e44;margin-top:2px;}
.bar>div{height:100%;background:linear-gradient(90deg,var(--red),#ff8a9b);transition:width .2s;}
.bar.opp>div{background:linear-gradient(90deg,var(--purple),#7a2ee6);}
#relicBar{display:flex;gap:6px;margin-top:6px;justify-content:center;flex-wrap:wrap;}
.relic-badge{width:28px;height:28px;border-radius:6px;border:1px solid var(--gold);background:linear-gradient(160deg,#3a2e44,#241b2c);
display:flex;align-items:center;justify-content:center;overflow:hidden;}
.relic-badge img{width:100%;height:100%;object-fit:contain;}
.hand{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:780px;}
.card{width:120px;min-height:172px;background-image:url('fondo_carta.png'),linear-gradient(160deg,#241b2c,#150f1c);
background-size:cover,cover;background-position:center,center;border:1px solid var(--gold);
border-radius:8px;padding:6px;font-size:.66em;text-align:center;cursor:pointer;position:relative;transition:transform .1s;
box-shadow:0 0 6px #000 inset,0 0 2px var(--gold) inset;}
.card::before,.card::after{content:'';position:absolute;width:12px;height:12px;border:2px solid var(--gold);opacity:.85;pointer-events:none;}
.card::before{top:3px;left:3px;border-right:none;border-bottom:none;}
.card::after{bottom:3px;right:3px;border-left:none;border-top:none;}
.card:hover{transform:translateY(-4px);}
.card.disabled{opacity:.4;cursor:not-allowed;filter:grayscale(1);}
.card img{width:100%;height:34px;object-fit:cover;border-radius:4px;margin-bottom:3px;background:#000;}
.c-name{font-weight:bold;color:var(--gold);margin:2px 0;font-size:1.05em;}
.c-eff{margin-bottom:4px;line-height:1.25;}
.c-range{color:var(--blue);font-size:.95em;margin-bottom:2px;}
.c-cdtxt{color:#ff9d9d;font-size:.9em;}
.cd-badge{position:absolute;top:2px;right:4px;background:var(--red);color:#fff;border-radius:50%;width:17px;height:17px;
font-size:1em;display:flex;align-items:center;justify-content:center;}
button{background:linear-gradient(160deg,#3a2e44,#241b2c);color:var(--text);border:1px solid var(--gold);
padding:8px 16px;border-radius:6px;cursor:pointer;font-family:inherit;}
button:hover{box-shadow:0 0 8px var(--gold);}
button:disabled{opacity:.4;cursor:not-allowed;}
#log{width:100%;max-width:660px;max-height:80px;overflow-y:auto;background:#000a;border-radius:6px;padding:6px 10px;
font-size:.72em;border:1px solid #3a2e44;}
#msg{font-size:1.05em;color:var(--gold);text-shadow:0 0 8px var(--gold);min-height:1.3em;text-align:center;}
.overlay{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;
gap:16px;z-index:50;padding:16px;}
@keyframes shake{10%,90%{transform:translate(-2px,0)}20%,80%{transform:translate(3px,-2px)}30%,50%,70%{transform:translate(-4px,3px)}40%,60%{transform:translate(4px,2px)}}
.shake{animation:shake .35s;}
@keyframes dmgpulse{0%{filter:brightness(2.6) drop-shadow(0 0 10px red);}100%{filter:none;}}
.dmgflash{animation:dmgpulse .32s;}
@keyframes healpulse{0%{filter:brightness(2.2) drop-shadow(0 0 10px #6bff9e);}100%{filter:none;}}
.healflash{animation:healpulse .32s;}
@keyframes rootpulse{0%{filter:brightness(2.2) drop-shadow(0 0 10px var(--purple));}100%{filter:none;}}
.rootflash{animation:rootpulse .32s;}
</style>
</head>
<body>
<h1>ECHOES OF THE ABYSS</h1>
<div id="msg"></div>
<div class="hud">
<span>Piso <b id="floor">1</b></span><span>Turno <b id="turn">1</b></span><span>Puntos de Acción <b id="pa">2</b>/2</span>
</div>
<div class="hpwrap">
Invocador <span id="pStatus"></span><div class="bar"><div id="phpbar" style="width:100%"></div></div>
<div style="margin-top:6px">Rival <span id="oStatus"></span><div class="bar opp"><div id="ohpbar" style="width:100%"></div></div></div>
<div id="relicBar"></div>
</div>
<div id="board"></div>
<div class="hand" id="hand"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
<button id="endTurnBtn">Terminar Turno</button>
<button id="restartBtn" style="display:none">Volver al Menú</button>
</div>
<div id="log"></div>

<div class="overlay" id="mainMenu" style="display:flex">
<h1 style="font-size:2em;margin:0">ECHOES OF THE ABYSS</h1>
<div>Récord Máximo: Piso <b id="recordVal" style="color:var(--gold)">0</b></div>
<div id="leaderboardList" style="font-size:.85em;max-width:260px;text-align:center"></div>
<button id="startBtn" style="font-size:1.1em;padding:12px 28px">Iniciar Viaje</button>
<button id="continueBtn" style="display:none">Continuar Viaje</button>
</div>

<div class="overlay" id="rewardScreen">
<h2 style="color:var(--gold);text-align:center">¡Elige una nueva carta para tu mazo!</h2>
<div class="hand" id="rewardCards"></div>
</div>

<div class="overlay" id="relicScreen">
<h2 style="color:var(--gold);text-align:center">Elige una Reliquia Pasiva</h2>
<div class="hand" id="relicCards"></div>
</div>

<div class="overlay" id="eventScreen">
<img id="eventImg" src="evento_altar.png" onerror="this.style.display='none'" style="max-width:220px;border-radius:10px;border:2px solid var(--gold);box-shadow:0 0 20px #000;">
<h2 id="eventTitle" style="color:var(--gold);text-align:center"></h2>
<p id="eventDesc" style="max-width:480px;text-align:center"></p>
<div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">
<button id="eventOptA"></button>
<button id="eventOptB"></button>
</div>
</div>

<div class="overlay" id="scoreScreen">
<h2 style="color:var(--gold);text-align:center">¡Entraste al Top 100!</h2>
<p style="text-align:center">Llegaste al Piso <b id="scoreFloorVal" style="color:var(--gold)"></b>. Introduce tu nombre:</p>
<input id="scoreNameInput" maxlength="16" placeholder="Tu nombre" style="padding:8px;border-radius:6px;border:1px solid var(--gold);background:#1a1220;color:var(--text);font-family:inherit;text-align:center">
<button id="scoreSubmitBtn">Enviar</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>

const SVG_PLAYER='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="a" cx="50%" cy="35%" r="65%"><stop offset="0%" stop-color="#1c2a4a"/><stop offset="100%" stop-color="#05060f"/></radialGradient></defs><circle cx="50" cy="50" r="48" fill="url(#a)"/><path d="M50 16C31 16 24 38 24 60L28 90L72 90L76 60C76 38 69 16 50 16Z" fill="#141225" stroke="#3ee6ff" stroke-width="2.5"/><path d="M50 24C36 24 31 40 31 56L34 66Q50 74 66 66L69 56C69 40 64 24 50 24Z" fill="#0a0716"/><circle cx="42" cy="54" r="4.5" fill="#3ee6ff"/><circle cx="58" cy="54" r="4.5" fill="#3ee6ff"/></svg>');
const SVG_ECO='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="b" cx="50%" cy="35%" r="65%"><stop offset="0%" stop-color="#3a1a55"/><stop offset="100%" stop-color="#0b0512"/></radialGradient></defs><circle cx="50" cy="50" r="48" fill="url(#b)"/><path d="M50 14C30 14 24 34 27 54C18 60 23 74 32 71C29 82 41 87 44 77C48 90 56 88 58 77C63 87 74 81 70 71C80 73 83 59 74 54C77 34 70 14 50 14Z" fill="#7b3fb0" opacity="0.55"/><circle cx="41" cy="52" r="4.5" fill="#eec9ff"/><circle cx="59" cy="52" r="4.5" fill="#eec9ff"/></svg>');
const SVG_ROCA='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,8 80,28 90,58 68,92 32,92 10,58 20,28" fill="#5c5762" stroke="#221e28" stroke-width="4"/><polygon points="50,8 80,28 58,44 38,38 20,28" fill="#7a7482"/><polygon points="32,92 45,60 58,70 68,92" fill="#3f3a46"/></svg>');

let deck=[],ownedRelics=[],playerMax=20,carryHP=20,golpeBonus=0,oppMaxBonus=0,zancadaCdBonus=0,drenarBonus=0,handSizeBonus=0,floor=1,prevFloorLog=[],S;

function dist(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c);}
function hasRelic(id){return ownedRelics.indexOf(id)>=0;}
function hazardAt(r,c){return S.hazards.find(function(h){return h.r===r&&h.c===c;});}
function moveBlocked(r,c){var h=hazardAt(r,c);return !!(h&&h.type==='roca');}
function lineBlocked(a,b){
 if(a.r===b.r){var lo=Math.min(a.c,b.c),hi=Math.max(a.c,b.c);for(var c=lo+1;c<hi;c++){var h=hazardAt(a.r,c);if(h&&h.type==='roca')return true;}return false;}
 if(a.c===b.c){var lo2=Math.min(a.r,b.r),hi2=Math.max(a.r,b.r);for(var r=lo2+1;r<hi2;r++){var h2=hazardAt(r,a.c);if(h2&&h2.type==='roca')return true;}return false;}
 return false;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function drawHand(){var pool=deck.slice();shuffle(pool);S.hand=pool.slice(0,Math.min(4+handSizeBonus,pool.length));}
function getRecord(){try{return parseInt(localStorage.getItem('eoa_record')||'0',10);}catch(e){return 0;}}
function updateRecord(){try{if(floor>getRecord())localStorage.setItem('eoa_record',String(floor));}catch(e){}}

//    create policy "public read" on leaderboard for select using (true);
//    create policy "public insert" on leaderboard for insert with check (true);

const SUPABASE_URL='https://sdahjwrvcsjyoarlfhop.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_cCdfKxPFI7ASGYvqvS7I2A_tTTPOeA08bWv65v_5vO-E8eL_S4_p3_r7';
let sb=null;
try{if(window.supabase&&SUPABASE_URL.indexOf('YOUR_SUPABASE_URL')===-1){sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);}}catch(e){}
async function fetchLeaderboard(limit){
 if(!sb)return [];
 try{var res=await sb.from('leaderboard').select('name,floor').order('floor',{ascending:false}).limit(limit||100);
  return res.data||[];
 }catch(e){return [];}
}
async function submitScore(name,floorScore){
 if(!sb)return false;
 try{var res=await sb.from('leaderboard').insert([{name:name,floor:floorScore}]);return !res.error;}catch(e){return false;}
}
async function refreshLeaderboardUI(){
 var el=document.getElementById('leaderboardList');
 if(!sb){el.innerHTML='';return;}
 var rows=await fetchLeaderboard(10);
 el.innerHTML=rows.length?('<b style="color:var(--gold)">Top Invocadores</b><br>'+rows.map(function(r,i){return (i+1)+'. '+r.name+' — Piso '+r.floor;}).join('<br>')):'';
}

function saveRun(){try{localStorage.setItem('eoa_save',JSON.stringify({floor:floor,carryHP:carryHP,playerMax:playerMax,deck:deck,ownedRelics:ownedRelics,golpeBonus:golpeBonus,oppMaxBonus:oppMaxBonus,zancadaCdBonus:zancadaCdBonus,drenarBonus:drenarBonus,handSizeBonus:handSizeBonus,prevFloorLog:prevFloorLog}));}catch(e){}}
function loadRun(){try{var s=localStorage.getItem('eoa_save');return s?JSON.parse(s):null;}catch(e){return null;}}
function clearRun(){try{localStorage.removeItem('eoa_save');}catch(e){}}

function showMainMenu(){
 document.getElementById('recordVal').textContent=getRecord();
 document.getElementById('mainMenu').style.display='flex';
 document.getElementById('restartBtn').style.display='none';
 var save=loadRun();
 document.getElementById('continueBtn').style.display=save?'inline-block':'none';
 refreshLeaderboardUI();
}
function initGame(){
 deck=['golpe','zancada','escudo'];
 ownedRelics=[];playerMax=20;carryHP=playerMax;golpeBonus=0;oppMaxBonus=0;zancadaCdBonus=0;drenarBonus=0;handSizeBonus=0;
 floor=1;prevFloorLog=[];
 clearRun();
 document.getElementById('mainMenu').style.display='none';
 showRelicChoice(function(){beginFloorRouting();});
}
document.getElementById('startBtn').onclick=initGame;
document.getElementById('continueBtn').onclick=function(){
 var save=loadRun();if(!save)return;
 deck=save.deck;ownedRelics=save.ownedRelics;playerMax=save.playerMax;carryHP=save.carryHP;
 golpeBonus=save.golpeBonus;oppMaxBonus=save.oppMaxBonus;zancadaCdBonus=save.zancadaCdBonus;
 drenarBonus=save.drenarBonus||0;handSizeBonus=save.handSizeBonus||0;floor=save.floor;prevFloorLog=save.prevFloorLog||[];
 document.getElementById('mainMenu').style.display='none';
 beginFloorRouting();
};
document.getElementById('restartBtn').onclick=function(){document.getElementById('restartBtn').style.display='none';showMainMenu();};

function showRelicChoice(cb){
 var pool=RELICS.filter(function(r){return ownedRelics.indexOf(r.id)===-1;});
 shuffle(pool);
 var picks=pool.slice(0,Math.min(2,pool.length));
 if(picks.length===0){cb();return;}
 var el=document.getElementById('relicCards');el.innerHTML='';
 picks.forEach(function(rl){
  var d=document.createElement('div');d.className='card';
  d.innerHTML='<img src="'+rl.img+'" onerror="this.style.display=\'none\'"><div class="c-name">'+rl.name+'</div><div class="c-eff">'+rl.desc+'</div>';
  d.onclick=function(){
   ownedRelics.push(rl.id);
   if(rl.id==='anillo'){playerMax+=10;carryHP+=10;}
   document.getElementById('relicScreen').style.display='none';
   cb();
  };
  el.appendChild(d);
 });
 document.getElementById('relicScreen').style.display='flex';
}

function generateHazards(){
 var cells=[];
 for(var r=0;r<5;r++)for(var c=0;c<5;c++){
  if((r===S.player.r&&c===S.player.c)||(r===S.opp.r&&c===S.opp.c))continue;
  cells.push({r:r,c:c});
 }
 shuffle(cells);
 var count=2+Math.floor(Math.random()*2);
 var hz=[];
 for(var i=0;i<count&&i<cells.length;i++)hz.push({r:cells[i].r,c:cells[i].c,type:Math.random()<0.5?'roca':'lava'});
 return hz;
}

function nextFloor(){
 floor++;
 if(floor%4===0)showRelicChoice(beginFloorRouting);
 else beginFloorRouting();
}
function beginFloorRouting(){
 updateRecord();
 saveRun();
 if(floor%3===0)beginEventFloor();
 else beginFloor();
}
const EVENTS=[
{title:'Cámara del Destino: El Altar de Sangre',img:'evento_altar.png',

 bLabel:'Recoger un fragmento: -1 turno de enfriamiento permanente en Zancada Fantasma',
 applyA:function(){carryHP=playerMax;oppMaxBonus+=5;},
 applyB:function(){zancadaCdBonus+=1;}},
{title:'Cámara del Destino: El Espejo Roto',img:'evento_espejo.png',
 desc:'Un espejo agrietado refleja una versión más débil, o más fuerte, de ti mismo.',
 aLabel:'Quebrar el espejo: -5 de vida máxima permanente, pero el próximo Eco tendrá -5 de vida máxima',
 bLabel:'Sellar el espejo: sin cambios de vida, pero tu mano de cartas será 1 más grande a partir de ahora',
 applyA:function(){playerMax=Math.max(10,playerMax-5);carryHP=Math.min(playerMax,carryHP);oppMaxBonus-=5;},
 applyB:function(){handSizeBonus+=1;}},
{title:'Cámara del Destino: El Pacto Sangriento',img:'evento_pacto.png',
 desc:'Una voz susurrante te ofrece un trato: fuerza a cambio de sangre futura, o resistencia sin premio.',
 aLabel:'Aceptar el pacto: curación completa, pero tus futuros Ecos serán +5 más fuertes',
 bLabel:'Rechazar el pacto: +1 de daño permanente en Drenar Esencia',
 applyA:function(){carryHP=playerMax;oppMaxBonus+=5;},
 applyB:function(){drenarBonus+=1;}}
];
let currentEvent=null;
function beginEventFloor(){
 currentEvent=EVENTS[Math.floor(Math.random()*EVENTS.length)];
 var img=document.getElementById('eventImg');img.src=currentEvent.img;img.style.display='';
 document.getElementById('eventTitle').textContent=currentEvent.title;
 document.getElementById('eventDesc').textContent=currentEvent.desc;
 document.getElementById('eventOptA').textContent=currentEvent.aLabel;
 document.getElementById('eventOptB').textContent=currentEvent.bLabel;
 setMsg('Una presencia antigua te observa...');
 document.getElementById('eventScreen').style.display='flex';
}
document.getElementById('eventOptA').onclick=function(){currentEvent.applyA();document.getElementById('eventScreen').style.display='none';nextFloor();};
document.getElementById('eventOptB').onclick=function(){currentEvent.applyB();document.getElementById('eventScreen').style.display='none';nextFloor();};

function beginFloor(){
 var oddF=(floor%2===1)?floor:floor-1;
 var oppMax=20+5*Math.floor((oddF-1)/2)+oppMaxBonus;
 S={floor:floor,turn:1,pa:2,oppMax:oppMax,freeMoveUsedThisTurn:false,vampireUsedThisTurn:false,
  player:{r:4,c:0,hp:carryHP,shield:0,rooted:0,burn:0,frozenNextTurn:false},
  opp:{r:0,c:4,hp:oppMax,shield:0,rooted:0,burn:0,frozenNextTurn:false,type:(floor%2===1)?'enemy':'eco',fury:false},
  cd:{},log:[],over:false,fx:null,showRewardPending:false,hazards:[]};
 deck.forEach(function(id){S.cd[id]=0;});
 drawHand();
 if(floor%2===0){S.player.r=0;S.player.c=4;S.opp.r=4;S.opp.c=0;}
 else{S.player.r=4;S.player.c=0;S.opp.r=0;S.opp.c=4;}
 S.hazards=generateHazards();
 document.getElementById('log').innerHTML='';
 document.getElementById('msg').textContent='';
 document.getElementById('rewardScreen').style.display='none';
 document.getElementById('restartBtn').style.display='none';
 render();
 logMsg('--- Piso '+floor+' ---');
}

function cardHTML(cd,cdLeft){
 var eff=cd.effect;
 if(cd.id==='golpe'&&golpeBonus>0)eff='Inflige '+(4+golpeBonus)+' puntos de daño (incluye +'+golpeBonus+' de un Altar de Sangre) a un enemigo justo al lado.';
 if(cd.id==='drenar'&&drenarBonus>0)eff='Arrebatas '+(2+drenarBonus)+' puntos de vida a tu enemigo (incluye +'+drenarBonus+' de un pacto) y recuperas 3 puntos de vida.';
 var effCd=cd.id==='zancada'?Math.max(0,cd.cd-zancadaCdBonus):cd.cd;
 return '<img src="'+cd.img+'" onerror="this.style.display=\'none\'">'+
  '<div class="c-name">'+cd.name+'</div>'+
  '<div class="c-eff">'+eff+'</div>'+
  '<div class="c-range">'+cd.range+'</div>'+
  '<div class="c-cdtxt">'+(effCd===0?'Sin enfriamiento':'Enfriamiento: '+effCd+' turno'+(effCd>1?'s':''))+'</div>'+
  (cdLeft>0?'<div class="cd-badge">'+cdLeft+'</div>':'');
}

function render(){
 document.getElementById('floor').textContent=S.floor;
 document.getElementById('turn').textContent=S.turn;
 document.getElementById('pa').textContent=S.pa;
 document.getElementById('phpbar').style.width=Math.max(0,S.player.hp/playerMax*100)+'%';
 document.getElementById('ohpbar').style.width=Math.max(0,S.opp.hp/S.oppMax*100)+'%';
 document.getElementById('pStatus').textContent=(S.player.burn>0?'🔥 Quemado ':'')+(S.player.frozenNextTurn?'❄️ Congelado ':'');
 document.getElementById('oStatus').textContent=(S.opp.burn>0?'🔥 Quemado ':'')+(S.opp.frozenNextTurn?'❄️ Congelado ':'');
 document.getElementById('relicBar').innerHTML=ownedRelics.map(function(id){
  var rl=RELICS.find(function(x){return x.id===id;});
  return '<div class="relic-badge" title="'+rl.name+': '+rl.desc+'"><img src="'+rl.img+'" onerror="this.style.display=\'none\'"></div>';
 }).join('');
 var board=document.getElementById('board');board.innerHTML='';
 for(var r=0;r<5;r++)for(var c=0;c<5;c++){
  var cell=document.createElement('div');cell.className='cell';cell.dataset.r=r;cell.dataset.c=c;
  var isP=r===S.player.r&&c===S.player.c, isO=r===S.opp.r&&c===S.opp.c;
  var hz=hazardAt(r,c);
  var html='';
  if(hz)html='<div class="hazard hazard-'+hz.type+'"><img src="'+(hz.type==='roca'?'roca.png':'lava.png')+'" onerror="this.onerror=null;this.src='+(hz.type==='roca'?'SVG_ROCA':'SVG_LAVA')+'"></div>';
  if(isP)html+='<div class="tok p-tok"><img src="jugador.png" onerror="this.onerror=null;this.src=SVG_PLAYER"></div>';
  if(isO)html+='<div class="tok e-tok"><img src="'+(S.opp.type==='eco'?'eco.png':'enemigo.png')+'" onerror="this.onerror=null;this.src=SVG_ECO"></div>';
  cell.innerHTML=html;
  if(!S.over&&!isO&&(S.pa>0||(hasRelic('eter')&&!S.freeMoveUsedThisTurn))&&Math.abs(r-S.player.r)+Math.abs(c-S.player.c)===1&&!moveBlocked(r,c))cell.classList.add('movable');
  cell.onclick=(function(rr,cc){return function(){tryMove(rr,cc);};})(r,c);
  board.appendChild(cell);
 }
 var hand=document.getElementById('hand');hand.innerHTML='';
 S.hand.forEach(function(id){
  var cd=CARDS.find(function(x){return x.id===id;});
  var cdLeft=S.cd[id];
  var div=document.createElement('div');
  div.className='card'+((cdLeft>0||S.pa<1||S.over)?' disabled':'');
  div.innerHTML=cardHTML(cd,cdLeft);
  div.onclick=function(){playCard(id);};
  hand.appendChild(div);
 });
 document.getElementById('endTurnBtn').disabled=S.over;
}

function logMsg(t){var l=document.getElementById('log');l.innerHTML+=t+'<br>';l.scrollTop=l.scrollHeight;}
function setMsg(t){document.getElementById('msg').textContent=t;}
function cellPos(r,c){return {x:c*60+28,y:r*60+28};}
function shakeBoard(){var b=document.getElementById('board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}
function spawnProjectile(r1,c1,r2,c2,color,kind){
 var board=document.getElementById('board');
 var p=document.createElement('div');
 var s=cellPos(r1,c1),e=cellPos(r2,c2);
 var ang=Math.atan2(e.y-s.y,e.x-s.x)*180/Math.PI;
 if(kind==='beam'){
  p.className='proj-beam';
  p.style.cssText='position:absolute;width:28px;height:7px;border-radius:4px;pointer-events:none;z-index:5;'+
   'background:linear-gradient(90deg,transparent,'+color+',#eaffff);'+
   'transform:translate(-50%,-50%) rotate('+ang+'deg);transition:left .24s linear,top .24s linear;';
 } else {
  p.className='proj-orb';
  p.style.cssText='position:absolute;width:18px;height:18px;border-radius:50%;pointer-events:none;z-index:5;'+
   'background:radial-gradient(circle,#fff,'+color+' 55%,transparent 100%);filter:blur(0.4px);'+
   'transform:translate(-50%,-50%);transition:left .27s ease-in;';
 }
 p.style.setProperty('--tcolor',color);
 p.style.left=s.x+'px';p.style.top=s.y+'px';
 board.appendChild(p);
 requestAnimationFrame(function(){p.style.left=e.x+'px';p.style.top=e.y+'px';});
 setTimeout(function(){p.remove();},280);
}
function flashToken(r,c,cls){
 var el=document.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"] .tok');
 if(el){el.classList.add(cls);setTimeout(function(){el.classList.remove(cls);},320);}
}
function runFX(fx){
 if(fx.hit){shakeBoard();spawnProjectile(fx.sr,fx.sc,fx.tr,fx.tc,fx.color,fx.kind||'orb');setTimeout(function(){flashToken(fx.tr,fx.tc,'dmgflash');},260);}
 if(fx.healSelf){flashToken(fx.sr,fx.sc,'healflash');}
 if(fx.rootTarget){flashToken(fx.rootTarget.r,fx.rootTarget.c,'rootflash');}
 if(fx.selfDmg){flashToken(fx.selfDmg.r,fx.selfDmg.c,'dmgflash');}
}
function postAction(){
 if(S.fx){runFX(S.fx);S.fx=null;}
 if(S.showRewardPending){S.showRewardPending=false;setTimeout(showReward,450);}
}

function tryMove(r,c){
 if(S.over)return;
 var freeMove=hasRelic('eter')&&!S.freeMoveUsedThisTurn;
 if(!freeMove&&S.pa<1)return;
 if(r===S.opp.r&&c===S.opp.c)return;
 if(moveBlocked(r,c))return;
 var dr=r-S.player.r,dc=c-S.player.c;
 if(Math.abs(dr)+Math.abs(dc)!==1)return;
 S.player.r=r;S.player.c=c;
 if(freeMove){S.freeMoveUsedThisTurn=true;} else {S.pa--;}
 S.log.push({turn:S.turn,type:'move',dr:dr,dc:dc});
 checkEnd();render();postAction();
 if(S.pa===0&&!S.over)endTurn();
}

function playCard(id){
 if(S.over||S.pa<1||S.cd[id]>0)return;
 executeCard('player',id);
 S.pa--;
 var meta=CARDS.find(function(c){return c.id===id;});
 S.cd[id]=Math.max(0,meta.cd-(id==='zancada'?zancadaCdBonus:0));
 S.log.push({turn:S.turn,type:'card',card:id});
 checkEnd();render();postAction();
 if(S.pa===0&&!S.over)endTurn();
}

function executeCard(caster,id){
 var src=caster==='player'?S.player:S.opp, tgt=caster==='player'?S.opp:S.player;
 var name=caster==='player'?'El Invocador':'El Eco';
 var color=caster==='player'?'var(--blue)':'var(--purple)';
 var kind=caster==='player'?'beam':'orb';
 var d=dist(src,tgt);
 function applyDmg(n){
  var n2=n;
  if(tgt.shield>0){var b=Math.min(tgt.shield,n2);n2-=b;tgt.shield-=b;}
  tgt.hp-=n2;
  if(caster==='player'&&n2>0&&hasRelic('vampiro')&&!S.vampireUsedThisTurn){src.hp=Math.min(playerMax,src.hp+1);S.vampireUsedThisTurn=true;}
  return n2;
 }
 if(id==='golpe'){
  if(d===1){var n=applyDmg(4+golpeBonus);S.fx={hit:true,sr:src.r,sc:src.c,tr:tgt.r,tc:tgt.c,color:color,kind:kind};logMsg(name+' golpea con las sombras, infligiendo '+n+' puntos de daño.');}
  else logMsg(name+' intenta un Golpe de Sombras, pero el rival está demasiado lejos.');
 } else if(id==='zancada'){
  var steps=2;
  while(steps>0){
   var drr=Math.sign(tgt.r-src.r),dcc=Math.sign(tgt.c-src.c);
   var nr=src.r,nc=src.c;
   if(drr!==0)nr+=drr; else if(dcc!==0)nc+=dcc;
   if(nr<0||nr>4||nc<0||nc>4||(nr===tgt.r&&nc===tgt.c)||moveBlocked(nr,nc))break;
   src.r=nr;src.c=nc;steps--;
  }
  logMsg(name+' avanza como un espectro hacia su objetivo.');
 } else if(id==='escudo'){
  src.shield+=5;S.fx={healSelf:true,sr:src.r,sc:src.c};
  logMsg(name+' invoca un Escudo de Almas que absorberá el próximo daño recibido.');
 } else if(id==='grito'){
  if(d<=2&&!lineBlocked(src,tgt)){var n=applyDmg(3);S.fx={hit:true,sr:src.r,sc:src.c,tr:tgt.r,tc:tgt.c,color:color,kind:kind};logMsg(name+' libera un Grito Abisal, infligiendo '+n+' puntos de daño.');}
  else logMsg(name+' libera un Grito Abisal, pero falla: el rival está fuera de alcance o hay una Roca Abisal en medio.');
 } else if(id==='drenar'){
  if(d<=2&&!lineBlocked(src,tgt)){
   var n=applyDmg(2+drenarBonus);var cap=caster==='player'?playerMax:S.oppMax;src.hp=Math.min(cap,src.hp+3);
   S.fx={hit:true,sr:src.r,sc:src.c,tr:tgt.r,tc:tgt.c,color:color,healSelf:true,kind:kind};
   logMsg(name+' drena '+n+' puntos de esencia y recupera 3 puntos de vida.');
  } else logMsg(name+' intenta drenar esencia, pero falla: fuera de alcance o bloqueado por una Roca Abisal.');
 } else if(id==='cadenas'){
  if(d<=3&&!lineBlocked(src,tgt)){tgt.rooted=1;S.fx={rootTarget:{r:tgt.r,c:tgt.c}};logMsg(name+' encadena a su rival, que perderá su próxima acción.');}
  else logMsg(name+' invoca las Cadenas del Vacío, pero falla: fuera de alcance o bloqueado.');
 } else if(id==='piro'){
  if(d<=3&&!lineBlocked(src,tgt)){var n=applyDmg(2);tgt.burn=(tgt.burn||0)+2;S.fx={hit:true,sr:src.r,sc:src.c,tr:tgt.r,tc:tgt.c,color:'#ff6a3d',kind:kind};logMsg(name+' invoca una Piromancia Siniestra, infligiendo '+n+' puntos de daño y prendiendo fuego a su objetivo.');}
  else logMsg(name+' invoca fuego oscuro, pero falla: fuera de alcance o bloqueado.');
 } else if(id==='empuje'){
  var drr=Math.sign(tgt.r-src.r),dcc=Math.sign(tgt.c-src.c);
  var steps=2;
  while(steps>0){
   var nr=tgt.r,nc=tgt.c;
   if(drr!==0)nr+=drr; else if(dcc!==0)nc+=dcc;
   if(nr<0||nr>4||nc<0||nc>4||moveBlocked(nr,nc)||(nr===src.r&&nc===src.c))break;
   tgt.r=nr;tgt.c=nc;steps--;
  }
  logMsg(name+' golpea con una Onda de Choque, empujando a su rival hacia atrás.');
 } else if(id==='hielo'){
  if(d<=2&&!lineBlocked(src,tgt)){var n=applyDmg(1);tgt.frozenNextTurn=true;S.fx={hit:true,sr:src.r,sc:src.c,tr:tgt.r,tc:tgt.c,color:'#8fe9ff',kind:kind};logMsg(name+' congela a su rival con una Prisión de Hielo, infligiendo '+n+' punto de daño.');}
  else logMsg(name+' lanza Prisión de Hielo, pero falla: fuera de alcance o bloqueado.');
 } else if(id==='sacrificio'){
  src.hp-=4;
  if(caster==='player')S.pa+=2;
  S.fx={selfDmg:{r:src.r,c:src.c}};
  logMsg(name+' realiza un Sacrificio de Sangre, perdiendo 4 puntos de vida'+(caster==='player'?' a cambio de 2 Puntos de Acción adicionales.':'.'));
 }
}

function applyLava(entity,label){
 var h=hazardAt(entity.r,entity.c);
 if(h&&h.type==='lava'){entity.hp-=2;logMsg(label+' termina su turno sobre una Grieta de Lava y pierde 2 puntos de vida.');}
}

function endTurn(){
 if(S.over)return;
 applyLava(S.player,'El Invocador');
 checkEnd();
 if(!S.over){
  deck.forEach(function(id){S.cd[id]=Math.max(0,S.cd[id]-1);});
  if(S.opp.burn>0){S.opp.hp-=1;S.opp.burn--;logMsg((S.opp.type==='eco'?'El Eco':'El enemigo')+' sufre 1 punto de daño por la quemadura.');checkEnd();}
 }
 if(!S.over){
  opponentTurn();
  applyLava(S.opp,S.opp.type==='eco'?'El Eco':'El enemigo');
  checkEnd();
 }
 if(!S.over){
  S.turn++;
  S.pa=S.player.frozenNextTurn?1:2; S.player.frozenNextTurn=false;
  S.player.shield=0;S.opp.shield=0;
  S.freeMoveUsedThisTurn=false;S.vampireUsedThisTurn=false;
  drawHand();
  if(S.player.burn>0){S.player.hp-=1;S.player.burn--;logMsg('El Invocador sufre 1 punto de daño por la quemadura.');checkEnd();}
 }
 render();postAction();
}
document.getElementById('endTurnBtn').onclick=endTurn;

function basicAI(dmgAmt,label){
 if(dist(S.player,S.opp)===1){
  var n=dmgAmt;
  if(S.player.shield>0){var b=Math.min(S.player.shield,n);n-=b;S.player.shield-=b;}
  S.player.hp-=n;
  S.fx={hit:true,sr:S.opp.r,sc:S.opp.c,tr:S.player.r,tc:S.player.c,color:label.indexOf('Eco')>=0?'var(--purple)':'var(--red)',kind:'orb'};
  logMsg(label+' te ataca, infligiendo '+n+' puntos de daño.');
 } else {
  var dr=Math.sign(S.player.r-S.opp.r),dc=Math.sign(S.player.c-S.opp.c);
  var nr=S.opp.r,nc=S.opp.c;
  if(dr!==0)nr+=dr; else if(dc!==0)nc+=dc;
  if(!moveBlocked(nr,nc)){S.opp.r=nr;S.opp.c=nc;logMsg(label+' se acerca a ti.');}
  else logMsg(label+' choca contra una Roca Abisal y no puede avanzar.');
 }
}

function opponentTurn(){
 if(S.opp.type==='enemy'){S.opp.frozenNextTurn=false;basicAI(3,'El enemigo');return;}
 if(S.opp.rooted>0){S.opp.rooted--;logMsg('El Eco está encadenado y no actúa.');return;}
 var frozen=S.opp.frozenNextTurn;S.opp.frozenNextTurn=false;
 if(!S.opp.fury){
  var acts=prevFloorLog.filter(function(a){return a.turn===S.turn;});
  if(frozen)acts=acts.slice(0,1);
  var maxT=0;prevFloorLog.forEach(function(a){if(a.turn>maxT)maxT=a.turn;});
  if(S.turn>maxT){
   S.opp.fury=true;
   logMsg('¡El Eco pierde el hilo de tu memoria y entra en Furia por Desincronización!');
  } else {
   acts.forEach(function(a){
    if(a.type==='move'){
     var nr=S.opp.r+a.dr,nc=S.opp.c+a.dc;
     if(nr>=0&&nr<=4&&nc>=0&&nc<=4&&!(nr===S.player.r&&nc===S.player.c)&&!moveBlocked(nr,nc)){S.opp.r=nr;S.opp.c=nc;}
     logMsg('El Eco repite tu movimiento.');
    } else if(a.type==='card'){executeCard('echo',a.card);}
   });
   if(acts.length===0)logMsg('El Eco permanece inmóvil, recordando...');
   return;
  }
 }
 basicAI(4,'El Eco enfurecido');
 if(!S.over&&S.player.hp>0)basicAI(4,'El Eco enfurecido');
}

function checkEnd(){
 if(S.player.hp<=0){
  S.over=true;setMsg('Has caído en el Abismo, en el Piso '+floor+'... Derrota.');
  document.getElementById('restartBtn').style.display='inline-block';
  clearRun();
  (async function(){
   var rows=await fetchLeaderboard(100);
   if(sb&&(rows.length<100||floor>rows[rows.length-1].floor)){
    document.getElementById('scoreFloorVal').textContent=floor;
    document.getElementById('scoreScreen').style.display='flex';
   }
  })();
 } else if(S.opp.hp<=0){
  S.over=true;
  prevFloorLog=S.log.slice();
  carryHP=Math.min(playerMax,S.player.hp+8);
  setMsg('¡Rival derrotado! Recuperas fuerzas y desciendes más profundo...');
  S.showRewardPending=true;
 }
}

function showReward(){
 var pool=CARDS.filter(function(c){return deck.indexOf(c.id)===-1;});
 shuffle(pool);
 var picks=pool.slice(0,Math.min(3,pool.length));
 if(picks.length===0){nextFloor();return;}
 var el=document.getElementById('rewardCards');el.innerHTML='';
 picks.forEach(function(cd){
  var d=document.createElement('div');d.className='card';
  d.innerHTML=cardHTML(cd,0);
  d.onclick=function(){deck.push(cd.id);document.getElementById('rewardScreen').style.display='none';nextFloor();};
  el.appendChild(d);
 });
 document.getElementById('rewardScreen').style.display='flex';
}

document.getElementById('scoreSubmitBtn').onclick=function(){
 var name=(document.getElementById('scoreNameInput').value||'').trim().slice(0,16)||'Anónimo';
 document.getElementById('scoreScreen').style.display='none';
 submitScore(name,parseInt(document.getElementById('scoreFloorVal').textContent,10));
};
showMainMenu();
</script>
